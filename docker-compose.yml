services:
  web:
    build: .
    container_name: django_polls_web
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - sqlite_data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: django_polls_caddy
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:

