{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Django Polls{% endblock %}</title>
  <!-- Local Bootstrap 5 CSS -->
  <link href="{% static 'polls/css/bootstrap.min.css' %}" rel="stylesheet">
  <!-- Local HTMX -->
  <script src="{% static 'polls/js/htmx.min.js' %}" defer></script>
</head>
<body class="bg-light" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'polls:index' %}">Polls App</a>
    </div>
  </nav>

  <main class="container" style="max-width: 720px;">
    {% block content %}{% endblock %}
  </main>

  <!-- Local Bootstrap 5 JS Bundle -->
  <script src="{% static 'polls/js/bootstrap.bundle.min.js' %}" defer></script>
</body>
</html>
