[project]
name = "django-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
]

[tool.pyright]
plugins = ["django_stubs_plugin.main"]
venvPath = "."
venv = ".venv"

