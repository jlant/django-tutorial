{% extends "polls/base.html" %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-header bg-white py-3">
    <h1 class="h4 mb-0">Available Polls</h1>
  </div>
  {% if latest_question_list %}
    <div class="list-group list-group-flush">
      {% for question in latest_question_list %}
        <a href="{% url 'polls:detail' question.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
          <span class="fw-medium">{{ question.question_text }}</span>
          <span class="badge bg-primary rounded-pill">Vote &rarr;</span>
        </a>
      {% endfor %}
    </div>
  {% else %}
    <div class="card-body">
      <p class="text-muted mb-0">No polls are available.</p>
    </div>
  {% endif %}
</div>
{% endblock %}
