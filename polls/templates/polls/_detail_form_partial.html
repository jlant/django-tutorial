<div class="card-body p-4" id="poll-container">
  <h1 class="h4 mb-3">{{ question.question_text }}</h1>

  {% if error_message %}
    <div class="alert alert-danger" role="alert">{{ error_message }}</div>
  {% endif %}

  <form hx-post="{% url 'polls:vote' question.id %}" hx-target="#poll-container" hx-swap="outerHTML">
    {% csrf_token %}
    <div class="mb-4">
      {% for choice in question.choice_set.all %}
        <div class="form-check py-2 border-bottom">
          <input class="form-check-input" type="radio" name="choice" id="choice{{ forloop.counter }}" value="{{ choice.id }}">
          <label class="form-check-label w-100" for="choice{{ forloop.counter }}">
            {{ choice.choice_text }}
          </label>
        </div>
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary px-4">Submit Vote</button>
    <a href="{% url 'polls:index' %}" class="btn btn-link">Cancel</a>
  </form>
</div>
