[project]
name = "django-tutorial"
version = "0.1.0"
description = "Django polls tutorial extended with HTMX, a DRF API and a Docker + Caddy deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "gunicorn>=27.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, Django-specific checks
select = ["E", "F", "I", "B", "UP", "DJ"]

